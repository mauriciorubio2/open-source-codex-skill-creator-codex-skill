name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate public skill repo
        run: python skills/open-source-codex-skill-creator/scripts/validate_public_skill_repo.py .
      - name: Run tests
        run: python -m unittest discover -s tests
